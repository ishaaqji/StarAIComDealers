services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: star-ai-postgres
    environment:
      POSTGRES_USER: starai
      POSTGRES_PASSWORD: starai_dev
      POSTGRES_DB: star_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starai -d star_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: star-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: star-ai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: star-ai-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://starai:starai_dev@postgres:5432/star_ai"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "dev-secret-change-in-production"
      JWT_REFRESH_SECRET: "dev-refresh-secret-change-in-production"
      PORT: "3001"
      NODE_ENV: "development"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "star-ai"
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend:/usr/src/app
      - /usr/src/app/node_modules

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: star-ai-dashboard
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
      PORT: "3000"
      NODE_ENV: "development"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/dashboard:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data:
